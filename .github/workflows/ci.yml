name: CI

# Mirrors the shopify-notion-webhook CI conventions (verify + audit + secret/fs
# scan) and adds a Docker image build, since this service ships as a container.
# Triggers on main and any deploy-readiness/** branch so a candidate is gated
# before it is audited and pushed.

on:
  push:
    branches:
      - main
      - "deploy-readiness/**"
  pull_request:
    branches:
      - main
      - "deploy-readiness/**"
  schedule:
    - cron: "17 2 * * 0"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # High+ only: fail the build on genuinely serious advisories, not noise.
      - run: npm audit --audit-level=high

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  filesystem-scan:
    name: Filesystem vulnerability scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy (filesystem)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-fs.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-fs.sarif

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      # Build the runtime image (no push — this gate proves the Dockerfile is
      # deployable; publishing to a registry is wired when a deploy host exists).
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: dikrashop-v2:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (health endpoint boots)
        run: |
          docker run -d --name smoke -p 3000:3000 \
            -e NODE_ENV=production \
            -e NOTION_TOKEN=ci_notion_token_1234567890 \
            -e NOTION_DATABASE_ID=ci_database_id_1234567890 \
            -e ZR_API_KEY=ci_zr_api_key_1234567890 \
            -e ZR_TENANT_ID=ci_tenant_id_1234567890 \
            dikrashop-v2:ci-${{ github.sha }}
          for i in $(seq 1 15); do
            if curl -fs http://127.0.0.1:3000/healthz >/dev/null; then
              echo "healthz OK"; break
            fi
            sleep 1
          done
          curl -fs http://127.0.0.1:3000/healthz
          docker rm -f smoke
